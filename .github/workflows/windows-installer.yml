name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [feat/windows-installer]
    paths-ignore: ['docs/**', 'README*', 'scripts/verify-*.py']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri
          cache-on-failure: true
      - uses: actions/cache@v4
        with:
          path: output/release/browser-cache
          key: windows-headless-shell-${{ hashFiles('requirements-release.lock') }}
      - name: Install pinned build inputs
        run: python -m pip install -r requirements-release.lock
      - name: Build small reader and optional conversion pack
        run: python scripts/build-small-windows.py
      - name: Verify frozen engine without developer runtimes on PATH
        run: python scripts/verify-frozen-engine.py output/release/conversion-content --output output/release/acceptance
      - name: Verify reader works without conversion resources
        run: python scripts/verify-reader-engine.py output/release/staging --output output/release/reader-acceptance
      - name: Install frontend inputs
        working-directory: desktop-tauri
        run: npm ci
      - name: Frontend tests
        working-directory: desktop-tauri
        run: npm test
      - name: Resolve optional runtime dependencies
        working-directory: desktop-tauri/src-tauri
        run: cargo generate-lockfile
      - name: Build native app
        working-directory: desktop-tauri
        run: npm run tauri build -- --no-bundle -- --locked
      - name: Native package safety tests
        working-directory: desktop-tauri/src-tauri
        run: cargo test --release --lib --locked
      - name: Package testable native directory
        shell: pwsh
        run: |
          Copy-Item desktop-tauri/src-tauri/target/release/MdPersia.exe output/release/staging/MdPersia.exe
          Compress-Archive -Path output/release/staging/* -DestinationPath output/release/MdPersia-native.zip
      - name: Save native acceptance artifact
        uses: actions/upload-artifact@v4
        with:
          name: MdPersia-native-x64
          path: output/release/MdPersia-native.zip
          compression-level: 0
          retention-days: 14
      - name: Build small installer
        working-directory: desktop-tauri
        shell: pwsh
        run: |
          $bundle = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE 'desktop-tauri/src-tauri/target/release/bundle/nsis'))
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE) + [IO.Path]::DirectorySeparatorChar
          if (-not $bundle.StartsWith($workspace, [StringComparison]::OrdinalIgnoreCase)) { throw 'Unsafe bundle cleanup path' }
          if (Test-Path -LiteralPath $bundle) { Remove-Item -LiteralPath $bundle -Recurse -Force }
          npm run tauri bundle -- --bundles nsis
      - name: Enforce 30 MB Setup limit
        run: python scripts/check-installer-size.py
      - name: Verify installed resources and actual registry commands
        shell: pwsh
        run: |
          $setup = (Get-ChildItem desktop-tauri/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName
          python scripts/verify-windows-installer.py $setup --output output/release/installer-acceptance --skip-native-ui
      - name: Publish immutable optional conversion resources
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $catalog = Get-Content output/release/staging/conversion-catalog.json -Raw | ConvertFrom-Json
          $tag = "resources-v$($catalog.version)"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            $notes = "Optional PDF and Word conversion resources for MdPersia $($catalog.version). Install only through MdPersia or its ZIP import. Reading and editing work without these resources. Filenames contain an immutable content hash."
            Set-Content output/release/resource-notes.txt $notes
            gh release create $tag --prerelease --title "MdPersia $($catalog.version) conversion resources" --notes-file output/release/resource-notes.txt --target $env:GITHUB_SHA --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Could not create the optional resource release" }
          }
          $existing = @(gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
          if ($existing -notcontains $catalog.filename) {
            gh release upload $tag "output/release/conversion-packs/$($catalog.filename)" --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Could not publish the optional conversion pack" }
          }
      - name: Save binaries and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MdPersia-Windows-x64
          path: |
            desktop-tauri/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop-tauri/src-tauri/Cargo.lock
            output/release/acceptance/frozen-engine-report.json
            output/release/installer-acceptance/installer-report.json
            output/release/reader-acceptance/reader-report.json
            output/release/installer-size.json
            output/release/staging/conversion-catalog.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
