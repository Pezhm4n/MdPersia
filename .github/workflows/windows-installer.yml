name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [feat/windows-installer]
    paths-ignore: ['docs/**', 'README*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri
      - name: Install pinned build inputs
        run: python -m pip install -r requirements-release.lock
      - name: Build offline engine
        run: python scripts/build-windows.py
      - name: Install frontend inputs
        working-directory: desktop-tauri
        run: npm ci
      - name: Frontend tests
        working-directory: desktop-tauri
        run: npm test
      - name: Build native app and offline installer
        working-directory: desktop-tauri
        run: npm run tauri build -- --bundles nsis
      - name: Package testable native directory
        shell: pwsh
        run: |
          Copy-Item desktop-tauri/src-tauri/target/release/MdPersia.exe output/release/staging/MdPersia.exe
          Compress-Archive -Path output/release/staging/* -DestinationPath output/release/MdPersia-native.zip
      - name: Save binaries and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MdPersia-Windows-x64
          path: |
            desktop-tauri/src-tauri/target/release/bundle/nsis/*-setup.exe
            output/release/MdPersia-native.zip
            desktop-tauri/src-tauri/Cargo.lock
          if-no-files-found: warn
          retention-days: 14
